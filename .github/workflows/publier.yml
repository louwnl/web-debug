name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verifier-donnees.js
      - run: node tools/tester-analyse.js
      - run: node tools/tester-outils.js
      - run: node tools/tester-perso.js
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js data icones _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
