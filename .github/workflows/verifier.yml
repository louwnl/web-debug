name: Vérifier les données

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verifier-donnees.js
      - run: node tools/tester-analyse.js
      - run: node tools/tester-outils.js
      - run: node tools/tester-perso.js
      - name: Fiche à jour avec fiche/fiche-reseau.md
        run: node tools/generer-fiche.js && git diff --exit-code data/fiche.js
