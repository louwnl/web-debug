<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic réseau</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <h1>Diagnostic réseau</h1>
    <label class="choix-os">
      <span>Système dépanné</span>
      <select id="os">
        <option value="windows">Windows</option>
        <option value="macos">macOS</option>
        <option value="linux">Linux</option>
      </select>
    </label>
  </header>

  <nav class="onglets" role="tablist">
    <button type="button" role="tab" id="onglet-guide" aria-controls="vue-guide" aria-selected="true">Diagnostic guidé</button>
    <button type="button" role="tab" id="onglet-catalogue" aria-controls="vue-catalogue" aria-selected="false">Catalogue</button>
  </nav>

  <main>
    <section id="vue-guide" role="tabpanel" aria-labelledby="onglet-guide">
      <ol id="fil" class="fil" aria-label="Étapes déjà suivies"></ol>
      <div id="etape"></div>
    </section>

    <section id="vue-catalogue" role="tabpanel" aria-labelledby="onglet-catalogue" hidden>
      <input id="recherche" type="search" placeholder="Chercher une commande (ping, dns, mtu, wifi…)" autocomplete="off">
      <div id="liste-commandes"></div>
    </section>
  </main>

  <script src="data/commandes.js"></script>
  <script src="data/parcours.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
