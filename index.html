<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic réseau</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <h1>Diagnostic réseau</h1>
    <label class="choix-os">
      <span>Système dépanné</span>
      <select id="os">
        <option value="windows">Windows</option>
        <option value="macos">macOS</option>
        <option value="linux">Linux</option>
      </select>
    </label>
  </header>

  <nav class="onglets" role="tablist">
    <button type="button" role="tab" id="onglet-guide" aria-controls="vue-guide" aria-selected="true">Diagnostic guidé</button>
    <button type="button" role="tab" id="onglet-catalogue" aria-controls="vue-catalogue" aria-selected="false">Catalogue</button>
  </nav>

  <main>
    <section id="vue-guide" role="tabpanel" aria-labelledby="onglet-guide">
      <ol id="fil" class="fil" aria-label="Étapes déjà suivies"></ol>
      <div id="valeurs-guide" class="valeurs" hidden></div>
      <div id="etape"></div>

      <details class="carte session">
        <summary>Notes et compte rendu</summary>
        <label class="observation">
          <span>Notes libres sur ce dépannage</span>
          <textarea id="notes" rows="4" placeholder="Machine, utilisateur, contexte, ce qui a été tenté…"></textarea>
        </label>
        <div class="actions-nav">
          <button type="button" class="principal" data-action="exporter">Copier le compte rendu</button>
          <button type="button" class="secondaire" data-action="telecharger">Télécharger (.txt)</button>
          <button type="button" class="secondaire danger" data-action="nouvelle-session">Nouvelle session</button>
        </div>
        <p class="note">La session (étapes, observations, notes, valeurs) est gardée dans ce navigateur jusqu'à « Nouvelle session ».</p>
      </details>
    </section>

    <section id="vue-catalogue" role="tabpanel" aria-labelledby="onglet-catalogue" hidden>
      <input id="recherche" type="search" placeholder="Chercher une commande (ping, dns, mtu, wifi…)" autocomplete="off">
      <div id="valeurs-catalogue" class="valeurs" hidden></div>
      <div id="liste-commandes"></div>
    </section>
  </main>

  <script src="data/commandes.js"></script>
  <script src="data/parcours.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
