<svg class="schema" viewBox="0 0 640 340" role="img" aria-labelledby="schema-titre schema-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="schema-titre">Montage de test : 2 switchs et un FortiGate</title>
  <desc id="schema-desc">Le PC est sur SW-B en VLAN 10. SW-B et SW-A sont reliés par un trunk 802.1Q qui transporte les VLAN 10 et 20. Sur SW-A, le port dmz du FortiGate est en VLAN 10 et le port wan2 en VLAN 20, comme la SVI de SW-A.</desc>

  <!-- Liens -->
  <line class="lien v10" x1="150" y1="230" x2="150" y2="280"/>
  <line class="lien trunk" x1="240" y1="200" x2="360" y2="200"/>
  <line class="lien v10" x1="410" y1="76" x2="410" y2="170"/>
  <line class="lien v20" x1="530" y1="76" x2="530" y2="170"/>

  <text class="etiquette v10" x="160" y="260">access VLAN 10</text>
  <text class="etiquette" x="300" y="190" text-anchor="middle">trunk 802.1Q</text>
  <text class="etiquette discret" x="300" y="218" text-anchor="middle">VLAN 10 + 20</text>
  <text class="etiquette v10" x="402" y="128" text-anchor="end">dmz · VLAN 10</text>
  <text class="etiquette v20" x="522" y="128" text-anchor="end">wan2 · VLAN 20</text>

  <!-- Équipements -->
  <rect class="boite" x="360" y="20" width="220" height="56" rx="8"/>
  <text class="nom" x="470" y="45" text-anchor="middle">FortiGate</text>
  <text class="etiquette discret" x="470" y="64" text-anchor="middle">routeur entre les VLAN</text>

  <rect class="boite" x="360" y="170" width="220" height="60" rx="8"/>
  <text class="nom" x="470" y="194" text-anchor="middle">SW-A</text>
  <rect class="pastille v20" x="415" y="203" width="110" height="20" rx="10"/>
  <text class="etiquette v20" x="470" y="217" text-anchor="middle">SVI · VLAN 20</text>

  <rect class="boite" x="60" y="170" width="180" height="60" rx="8"/>
  <text class="nom" x="150" y="205" text-anchor="middle">SW-B</text>

  <rect class="boite" x="90" y="280" width="120" height="44" rx="8"/>
  <text class="nom" x="150" y="301" text-anchor="middle">PC</text>
  <text class="etiquette v10" x="150" y="317" text-anchor="middle">VLAN 10</text>
</svg>
